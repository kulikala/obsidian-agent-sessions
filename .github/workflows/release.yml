name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build provenance attestation below.
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - run: npm ci
      - run: npm run build

      # Lets anyone verify the released files were built here, from this commit
      # (`gh attestation verify main.js --repo kulikala/obsidian-agent-sessions`).
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            plugin/main.js
            plugin/manifest.json
            plugin/styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --draft \
            main.js manifest.json styles.css
