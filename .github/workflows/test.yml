name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Every Python the README lists as supported: from MIN_PYTHON (plugin/src/backend/bundle.ts) to the
  # newest tested. Change the README's Requirements together with this list (docs/readme-guide.md).
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # setup-python has no 3.9 build for the Ubuntu that ubuntu-latest names, so 3.9 runs on 24.04.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: unittest
        run: python3 -W error -m unittest discover -s tests -t .

  # Native Windows: the ConPTY daemon, the loopback transport, process checks, path matching and the parts of
  # setup that differ there. The rest of the suite drives Unix sockets and PTYs directly.
  python-windows:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: unittest
        run: python -W error -m unittest discover -s tests/windows -t . && python -W error -m unittest tests.test_transport tests.test_paths tests.claude.test_setup

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      # The checks Obsidian's community plugin review runs (eslint-plugin-obsidianmd).
      - run: npm run lint
      - run: npm test

  # The smoke test's host side (tools/smoke): its pure helpers, with Node's built-in runner.
  smoke-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node --check tools/smoke/inject.js
      - run: node --test "tools/smoke/test/*.test.mjs"

  # The pre-push audit's static checks (tools/audit): privacy and secrets in the tree and in the
  # pushed commits, commit messages, the language rule, the locales, versions and the documents'
  # links. The build and the suites run in the jobs above.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node --test "tools/audit/test/*.test.mjs"

      - name: audit
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The pushed commits: a pull request's own, a push's new ones, or a new branch's since main.
          if [ -n "$BASE" ]; then
            range="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          elif git rev-parse --verify --quiet origin/main >/dev/null; then
            range="origin/main..HEAD"
          else
            range=none
          fi
          node tools/audit/run.mjs --skip-tests --range "$range"
