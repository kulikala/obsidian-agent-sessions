name: Test

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: unittest
        run: python3 -W error -m unittest discover -s tests -t .

  # Native Windows: the ConPTY daemon, the loopback transport, process checks and the parts of
  # setup that differ there. The rest of the suite drives Unix sockets and PTYs directly.
  python-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: unittest
        run: python -W error -m unittest discover -s tests/windows -t . && python -W error -m unittest tests.test_transport tests.claude.test_setup

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
